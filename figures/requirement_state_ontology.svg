<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081426"/><stop offset="1" stop-color="#102a46"/></linearGradient><style>text{font-family:Inter,Arial,sans-serif;fill:#eef6ff}.h{font-size:48px;font-weight:700}.sub{font-size:25px;fill:#9fb8d3}.cap{font-size:23px;font-weight:700}.body{font-size:22px;fill:#d6e4f2}.small{font-size:18px;fill:#9fb8d3}</style></defs>
<rect width="1600" height="900" fill="url(#bg)"/><text x="90" y="105" class="h">ReqBench · Requirement State Model</text><text x="90" y="150" class="sub">Two orthogonal axes: lifecycle is not the same as role or scope</text>
<rect x="90" y="220" width="680" height="510" rx="28" fill="#102640" stroke="#42c8e8" stroke-width="3"/><text x="130" y="285" class="cap" fill="#62d7f5">AXIS 1 · LIFECYCLE</text><text x="130" y="325" class="small">Does this requirement currently govern behavior?</text>
<rect x="135" y="390" width="570" height="85" rx="17" fill="#123d3b" stroke="#39d6b0" stroke-width="2"/><text x="170" y="445" class="cap">ACTIVE</text><text x="370" y="445" class="body">Currently applies</text>
<rect x="135" y="500" width="570" height="85" rx="17" fill="#44371d" stroke="#e9b64e" stroke-width="2"/><text x="170" y="555" class="cap">SUPERSEDED</text><text x="440" y="555" class="body">Replaced by later rule</text>
<rect x="135" y="610" width="570" height="85" rx="17" fill="#45232c" stroke="#ef7181" stroke-width="2"/><text x="170" y="665" class="cap">CANCELLED</text><text x="370" y="665" class="body">No longer required</text>
<rect x="830" y="220" width="680" height="510" rx="28" fill="#102640" stroke="#a88bf5" stroke-width="3"/><text x="870" y="285" class="cap" fill="#c5a9ff">AXIS 2 · ROLE / SCOPE</text><text x="870" y="325" class="small">How broadly and for how long does it apply?</text>
<rect x="875" y="390" width="570" height="85" rx="17" fill="#1a3654" stroke="#70b8ff" stroke-width="2"/><text x="910" y="445" class="cap">ORDINARY</text><text x="1140" y="445" class="body">Default scoped rule</text>
<rect x="875" y="500" width="570" height="85" rx="17" fill="#25334c" stroke="#b0a5ff" stroke-width="2"/><text x="910" y="555" class="cap">PERSISTENT</text><text x="1165" y="555" class="body">Survives later changes</text>
<rect x="875" y="610" width="570" height="85" rx="17" fill="#3c2d49" stroke="#d9a0ff" stroke-width="2"/><text x="910" y="665" class="cap">EXCEPTION</text><text x="1120" y="665" class="body">Applies only in stated scope</text>
<text x="90" y="800" class="body">A requirement has one lifecycle state and a separate role/scope label.</text><text x="90" y="842" class="small">Example: a persistent compatibility constraint can remain ACTIVE after a default is superseded.</text></svg>