<g transform="translate(860,235)"><rect width="335" height="430" rx="24" fill="#132d49" stroke="#b39cff" stroke-width="3"/><text x="35" y="70" class="label">C · Versioned Ledger</text><text x="35" y="145" class="body"><tspan x="35">Declarative state ledger</tspan><tspan x="35" dy="34">with versions and trace links.</tspan></text><path d="M35 240 H295" stroke="#b39cff" stroke-width="3"/><text x="35" y="300" class="note">Explicit current state</text></g>
