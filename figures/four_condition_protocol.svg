<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081426"/><stop offset="1" stop-color="#102a46"/></linearGradient><style>text{font-family:Inter,Arial,sans-serif;fill:#eef6ff}.h{font-size:48px;font-weight:700}.sub{font-size:25px;fill:#9fb8d3}.label{font-size:28px;font-weight:700}.body{font-size:21px;fill:#d8e6f4}.note{font-size:18px;fill:#9fb8d3}</style></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="90" y="105" class="h">ReqBench · Four Experimental Conditions</text><text x="90" y="150" class="sub">Same underlying requirement history · different state representations / feedback</text>
